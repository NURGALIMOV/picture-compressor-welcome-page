<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=1200, viewport-fit=cover" />
    <title>Picture Compressor Installed</title>
    <meta name="format-detection" content="telephone=no" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon-32x32.png"
    />

      type="image/png"
      sizes="16x16"
      href="assets/favicon-16x16.png"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #fff;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .container {
        padding-top: 100px;
        text-align: center;
      }
      .welcome-title {
        font-size: 3rem;
        font-weight: 700;
        margin-bottom: 12px;
        color: #2d3748;

        font-size: 1.375rem;
        margin-bottom: 24px;
        color: #4a5568;
      }

      img {
        margin: 0 auto 100px auto;
      }

      .compressed-img {
        width: 60%;
        height: auto;
        margin-bottom: 20px;
      }

  <body>
    <div class="container">
      <div class="welcome-title">Picture Compressor Installed Successfully</div>
      <div class="welcome-desc">
        Click the puzzle piece icon (1) in the top-right corner of your browser. Then, click the pin icon (2) next to the extension:
      </div>
      <img src="assets/1-final.png" alt="1" class="compressed-img" />
      <div class="welcome-desc">
        Open the extension (3) on any page to start using Picture Compressor:
      </div>
      <img src="assets/2-final.png" alt="2" class="compressed-img" />
